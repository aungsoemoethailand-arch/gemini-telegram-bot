name: Run Gemini Telegram Bot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telegram-gemini-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
      GEMINI_MODEL: gemini-3.8-flash
      MAX_HISTORY_MESSAGES: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }
          test -n "$ADMIN_TELEGRAM_ID" || { echo "ADMIN_TELEGRAM_ID is missing; add it as a repository secret"; exit 1; }
          case "$ADMIN_TELEGRAM_ID" in
            *[!0-9]*) echo "ADMIN_TELEGRAM_ID must contain digits only"; exit 1 ;;
          esac
          echo "Telegram, Gemini, and admin secrets are configured."

      - name: Start bot
        run: python bot.py
