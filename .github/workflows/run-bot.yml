name: Run Gemini Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telegram-gemini-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
      GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
      GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
      GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
      GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
      GROQ_API_KEY_10: ${{ secrets.GROQ_API_KEY_10 }}
      GROQ_MODEL: llama-3.3-70b-versatile
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      MAX_HISTORY_MESSAGES: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }
          if test -z "$GROQ_API_KEY" && test -z "$GROQ_API_KEY_1"; then echo "Warning: no GROQ_API_KEY fallback secret is loaded"; fi
          groq_slots=0
          for key in "$GROQ_API_KEY" "$GROQ_API_KEY_1" "$GROQ_API_KEY_2" "$GROQ_API_KEY_3" "$GROQ_API_KEY_4" "$GROQ_API_KEY_5" "$GROQ_API_KEY_6" "$GROQ_API_KEY_7" "$GROQ_API_KEY_8" "$GROQ_API_KEY_9" "$GROQ_API_KEY_10"; do test -n "$key" && groq_slots=$((groq_slots + 1)); done
          echo "Groq fallback slots loaded: $groq_slots"
          echo "Telegram and Gemini secrets are configured."

      - name: Start bot
        run: python bot.py
