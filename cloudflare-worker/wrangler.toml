name = "gemini-telegram-webhook"
main = "src/index.js"
compatibility_date = "2026-10-03"

[vars]
WORKER_URL = "https://gemini-telegram-webhook.aungsoemoe-thailand.workers.dev"
ENABLE_WEBHOOK = "true"
ADMIN_TELEGRAM_ID = ""
ADMIN_TELEGRAM_ID2 = "7930855703"
AI_API_URL = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
AI_MODEL = "gemini-3.8-flash"
GROQ_MODEL = "qwen/qwen3.8-27b"
AUTO_DELETE_ENABLED = "false"
ENABLE_MORNING_GREETING = "false"
ENABLE_MEMBER_GREETING = "false"
# Secretary Mode starts in approval-only mode: drafts go to the owner first.
SECRETARY_MODE_ENABLED = "true"
SECRETARY_MIN_REPLY_INTERVAL_SECONDS = "12"
SECRETARY_MAX_REPLIES_PER_HOUR = "20"
# Catalog search only: /ask, reviews, and external AI information mode are disabled in code.
COMMAND_AUTO_DELETE_SECONDS = "30"
AUTO_DELETE_MINUTES = "3"
# Set secrets with: npx wrangler secret put TELEGRAM_BOT_TOKEN
# Optional: npx wrangler secret put TELEGRAM_SECRET_TOKEN
# GitHub mirror: use a repo-restricted fine-grained token with Contents read/write.
# Add it with: npx wrangler secret put GITHUB_SYNC_TOKEN

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gemini-telegram-catalog"
database_id = "1a7d4522-0704-4d75-978f-6083be245458"
migrations_dir = "migrations"
